{% extends 'base_hr_dashboard.html' %}

{% block content %}
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Performance Goals</h4>
        <a href="{% url 'add_goal' %}" class="btn btn-primary">
            + Add Goal
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Employee</th>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Deadline</th>
                    </tr>
                </thead>

                <tbody>
                    {% for goal in goals %}
                    <tr>
                        <td>{{ goal.employee }}</td>
                        <td>{{ goal.title }}</td>

                        <td>
                            <span class="badge 
                                {% if goal.status == 'Completed' %}bg-success
                                {% elif goal.status == 'In Progress' %}bg-warning
                                {% else %}bg-secondary
                                {% endif %}
                            ">
                                {{ goal.status }}
                            </span>
                        </td>

                        <td>{{ goal.deadline }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center text-muted">
                            No goals added yet
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>

        </div>
    </div>
</div>
{% endblock %}
