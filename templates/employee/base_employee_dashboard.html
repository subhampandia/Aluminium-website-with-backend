<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Employee Panel{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />

  <style>
    body {
      background-color: #f4f8fb;
    }

    .sidebar {
      width: 240px;
      height: 100vh;
      background: #0d6efd;
      color: #fff;
      position: fixed;
      top: 0;
      left: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .sidebar h5 {
      padding: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.3);
    }

    .sidebar a {
      color: #fff;
      text-decoration: none;
      padding: 12px 16px;
      display: block;
      border-radius: 6px;
      margin: 4px 8px;
    }

    .sidebar a:hover {
      background: rgba(255,255,255,0.2);
    }

    .content {
      margin-left: 240px;
      padding: 20px;
      transition: all 0.3s ease;
    }

    .navbar-custom {
      background: #4789e6;
      border-bottom: 1px solid #ddd;
    }

    .toggle-btn {
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <h5 class="text-center">Employee Panel</h5>

  <a href="{% url 'employee_dashboard' %}">
    <i class="bi bi-house me-2"></i> Dashboard
  </a>

  <a href="{% url 'employee_profile' %}">
    <i class="bi bi-person me-2"></i> My Profile
  </a>

  <a href="#">
    <i class="bi bi-clock me-2"></i> My Shift
  </a>

  <a href="#">
    <i class="bi bi-calendar-check me-2"></i> Attendance
  </a>

  <a href="{% url 'apply_leave' %}">
    <i class="bi bi-pencil-square me-2"></i> Apply Leave
  </a>

  <a href="{% url 'my_leaves' %}">
    <i class="bi bi-file-text me-2"></i> My Leaves
  </a>

  <hr class="text-white mx-3">

  <a href="#" data-bs-toggle="modal" data-bs-target="#logoutModal">
    <i class="bi bi-box-arrow-right me-2"></i> Logout
  </a>
</div>

<!-- CONTENT -->
<div class="content" id="content">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-custom mb-3">
    <div class="container-fluid">
      <i class="bi bi-list toggle-btn" onclick="toggleSidebar()"></i>

      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="fw-semibold">{{ request.user.username }}</span>

        <div class="dropdown">
          <a href="#" data-bs-toggle="dropdown">
            <img
              src="https://via.placeholder.com/40"
              width="40"
              height="40"
              class="rounded-circle shadow"
              alt="Profile"
            />
          </a>

          <ul class="dropdown-menu dropdown-menu-end shadow">
            <li>
              <a class="dropdown-item" href="{% url 'employee_profile' %}">
  <i class="bi bi-person me-2"></i> Profile
</a>

            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <a
                class="dropdown-item text-danger"
                href="#"
                data-bs-toggle="modal"
                data-bs-target="#logoutModal"
              >
                <i class="bi bi-box-arrow-right me-2"></i> Logout
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <!-- PAGE CONTENT -->
  {% block content %}{% endblock %}

</div>

<!-- LOGOUT MODAL -->
<div class="modal fade" id="logoutModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Logout</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to logout?
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Sidebar Toggle -->
<script>
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const content = document.getElementById('content');

  if (sidebar.style.display === 'none') {
    sidebar.style.display = 'block';
    content.style.marginLeft = '240px';
  } else {
    sidebar.style.display = 'none';
    content.style.marginLeft = '0';
  }
}
</script>

</body>
</html>
