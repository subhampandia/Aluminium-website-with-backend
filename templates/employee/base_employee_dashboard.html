<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Employee Panel{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f8fb;
    }
    .sidebar {
      width: 240px;
      height: 100vh;
      background: #0d6efd;
      color: #fff;
      position: fixed;
    }
    .sidebar a {
      color: #fff;
      text-decoration: none;
      padding: 12px 16px;
      display: block;
    }
    .sidebar a:hover {
      background: rgba(255,255,255,0.2);
    }
    .content {
      margin-left: 240px;
      padding: 20px;
    }
    .topbar {
      background: #ffffff;
      padding: 10px 20px;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h5 class="text-center py-3 border-bottom">Employee Panel</h5>

    <a href="{% url 'employee_dashboard' %}">🏠 Dashboard</a>
    <a href="#">👤 My Profile</a>
    <a href="#">⏰ My Shift</a>
    <a href="#">📅 Attendance</a>
    <a href="{% url 'logout' %}">🚪 Logout</a>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="topbar">
      <strong>Welcome, {{ request.user.username }}</strong>
    </div>

    <div class="mt-4">
      {% block content %}{% endblock %}
    </div>
  </div>

</body>
</html>
