{% extends 'base_dashboard.html' %}
{% block content %}

<h3 class="mb-3">
  Attendance Calendar – {{ employee.full_name }}
</h3>

<div id="calendar"></div>

<!-- Modal -->
<div class="modal fade" id="attendanceModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Attendance Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p><strong>Date:</strong> <span id="modalDate"></span></p>
        <p><strong>Punch In:</strong> <span id="modalPunchIn"></span></p>
        <p><strong>Punch Out:</strong> <span id="modalPunchOut"></span></p>
        <p><strong>Hours:</strong> <span id="modalHours"></span></p>
        <p><strong>Status:</strong> <span id="modalStatus"></span></p>
      </div>
    </div>
  </div>
</div>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const calendarEl = document.getElementById('calendar');
  const modalEl = document.getElementById('attendanceModal');
  const modal = bootstrap.Modal.getOrCreateInstance(modalEl);

const events = {{ events|default:"[]"|safe }};

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    events: events,

    dateClick: function (info) {
      const event = events.find(e => e.start === info.dateStr);

      if (event && event.extendedProps) {
        updateModal(info.dateStr, event.extendedProps);
      } else {
        updateModal(info.dateStr, {});
      }
      modal.show();
    }
  });

  calendar.render();

  function updateModal(date, data) {
    document.getElementById('modalDate').innerText = date;
    document.getElementById('modalPunchIn').innerText = data.punch_in || '-';
    document.getElementById('modalPunchOut').innerText = data.punch_out || '-';
    document.getElementById('modalHours').innerText = data.working_hours || '-';
    document.getElementById('modalStatus').innerText = data.status || 'No Attendance';
  }
});
</script>

<a href="{% url 'admin_employee_attendance_list' %}" class="btn btn-secondary mt-3">
  Back
</a>

{% endblock %}
