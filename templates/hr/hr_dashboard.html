{% extends "base_hr_dashboard.html" %}

{% block content %}

<div class="container-fluid mt-4">

    <!-- Header -->
    <div class="mb-4">
        <h3 class="fw-bold">HR Dashboard</h3>
        <p class="text-muted mb-0">Overview of employees, leaves and attendance</p>
    </div>

    <!-- Stats Row -->
    <div class="row g-4">

        <!-- Employees -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0 rounded-3 h-100 dashboard-card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    
                    <div>
                        <h6 class="text-muted mb-1">Total Employees</h6>
                        <h3 class="fw-bold mb-0">{{ total_employees }}</h3>
                    </div>

                    <div class="icon-box bg-primary text-white">
                        <i class="bi bi-people-fill"></i>
                    </div>

                </div>
            </div>
        </div>

        <!-- Leaves -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0 rounded-3 h-100 dashboard-card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    
                    <div>
                        <h6 class="text-muted mb-1">Pending Leaves</h6>
                        <h3 class="fw-bold mb-0">{{ pending_leaves }}</h3>
                    </div>

                    <div class="icon-box bg-warning text-white">
                        <i class="bi bi-file-earmark-text"></i>
                    </div>

                </div>
            </div>
        </div>

        <!-- Attendance -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0 rounded-3 h-100 dashboard-card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    
                    <div>
                        <h6 class="text-muted mb-1">Today's Attendance</h6>
                        <h3 class="fw-bold mb-0">{{ today_attendance }}</h3>
                    </div>

                    <div class="icon-box bg-success text-white">
                        <i class="bi bi-calendar-check"></i>
                    </div>

                </div>
            </div>
        </div>

    </div>

</div>

{% endblock %}
