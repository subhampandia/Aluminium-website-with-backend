{% extends 'base_dashboard.html' %}
{% block title %}Assign Shift{% endblock %}

{% block content %}
<h5 class="mb-4">Assign Shift</h5>

<form method="post" class="card shadow-sm p-4" style="max-width: 720px;">
  {% csrf_token %}

  <!-- ================= DEPARTMENT ================= -->
  <label class="fw-bold mb-1">Department</label>

  <select id="deptSelect" class="form-select mb-3">
    <option value="">Select Department</option>
    {% for d in departments %}
    <option value="{{ d.id }}">{{ d.name }}</option>
    {% endfor %}
  </select>

  <!-- ================= EMPLOYEE ================= -->
  <label class="fw-bold mb-1">Employee</label>

  <select
    name="employee"
    id="employeeSelect"
    class="form-select mb-2"
    required
    disabled
  >
    <option value="">Select Employee</option>

    {% for emp in employees %}
    <option
      value="{{ emp.id }}"
      data-dept="{{ emp.department.id }}"
      data-deptname="{{ emp.department.name }}"
      data-desg="{{ emp.designation.name }}"
    >
      {{ emp.employee_id }} - {{ emp.first_name }} {{ emp.last_name }}
    </option>
    {% endfor %}
  </select>

  <!-- Employee Preview -->
  <div
    id="empPreview"
    class="alert alert-light border d-flex align-items-center mb-3"
  >
    <i class="bi bi-person-badge me-2 text-primary"></i>
    <small>
      <strong>Department:</strong> —
      &nbsp; | &nbsp;
      <strong>Designation:</strong> —
    </small>
  </div>

  <!-- ================= SHIFT ================= -->
  <label class="fw-bold mb-1">Shift</label>

  <select
    name="shift"
    id="shiftSelect"
    class="form-select mb-2"
    required
  >
    <option value="">Select Shift</option>

    {% for s in shifts %}
    <option
      value="{{ s.id }}"
      data-start="{{ s.start_time|time:'h:i A' }}"
      data-end="{{ s.end_time|time:'h:i A' }}"
    >
      {{ s.name }}
    </option>
    {% endfor %}
  </select>

  <!-- Shift Preview -->
  <div
    id="shiftPreview"
    class="alert alert-light border d-flex align-items-center mb-4"
  >
    <i class="bi bi-clock me-2 text-success"></i>
    <small>
      <strong>Shift Time:</strong> —
    </small>
  </div>

  <!-- ================= ACTIONS ================= -->
  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-success">
      Assign Shift
    </button>

    <a href="{% url 'shift_assign_list' %}" class="btn btn-secondary">
      Cancel
    </a>
  </div>

</form>


<!-- ================= SCRIPT ================= -->

<script>

const deptSelect = document.getElementById('deptSelect');
const empSelect = document.getElementById('employeeSelect');

deptSelect.addEventListener('change', function () {

  const deptId = this.value;
  const options = empSelect.querySelectorAll('option');

  options.forEach(opt => {

    if(!opt.value) return;

    const empDept = opt.getAttribute('data-dept');

    if(!deptId || empDept === deptId){
      opt.style.display = 'block';
    }else{
      opt.style.display = 'none';
    }

  });

  empSelect.disabled = !deptId;
  empSelect.value = "";

});


document.getElementById('employeeSelect').addEventListener('change', function () {

  const opt = this.options[this.selectedIndex];

  const dept = opt.getAttribute('data-deptname');
  const desg = opt.getAttribute('data-desg');

  document.getElementById('empPreview').innerHTML = dept
    ? `<i class="bi bi-person-badge me-2 text-primary"></i>
       <small>
         <strong>Department:</strong> ${dept}
         &nbsp; | &nbsp;
         <strong>Designation:</strong> ${desg}
       </small>`
    : `<i class="bi bi-person-badge me-2 text-primary"></i>
       <small>
         <strong>Department:</strong> —
         &nbsp; | &nbsp;
         <strong>Designation:</strong> —
       </small>`;

});


document.getElementById('shiftSelect').addEventListener('change', function () {

  const opt = this.options[this.selectedIndex];

  const start = opt.getAttribute('data-start');
  const end = opt.getAttribute('data-end');

  document.getElementById('shiftPreview').innerHTML = start
    ? `<i class="bi bi-clock me-2 text-success"></i>
       <small>
         <strong>Shift Time:</strong> ${start} – ${end}
       </small>`
    : `<i class="bi bi-clock me-2 text-success"></i>
       <small>
         <strong>Shift Time:</strong> —
       </small>`;

});

</script>

{% endblock %}
