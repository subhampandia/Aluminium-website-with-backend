{% extends 'base_dashboard.html' %}
{% block title %}Add Shift{% endblock %}

{% block content %}

<div class="d-flex justify-content-between mb-3">
  <h3>Add Shift</h3>
  <a href="{% url 'shift_list' %}" class="btn btn-secondary btn-sm">
    ← Back
  </a>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}

      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label">Shift Name *</label>
          <input type="text" name="name" class="form-control" required placeholder="e.g. Morning Shift">
        </div>

        <div class="col-md-3">
          <label class="form-label">Start Time *</label>
          <input type="time" name="start_time" class="form-control" required>
        </div>

        <div class="col-md-3">
          <label class="form-label">End Time *</label>
          <input type="time" name="end_time" class="form-control" required>
        </div>

        <div class="col-md-3">
          <label class="form-label">Break (Minutes)</label>
          <input type="number" name="break_minutes" class="form-control" min="0" placeholder="0">
        </div>

      </div>

      <div class="mt-4">
        <button class="btn btn-primary">Save Shift</button>
        <a href="{% url 'shift_list' %}" class="btn btn-secondary">Cancel</a>
      </div>

    </form>
  </div>
</div>

{% endblock %}
